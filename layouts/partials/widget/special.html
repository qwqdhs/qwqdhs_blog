{{- $tags := .Site.Data.tags -}}
{{- if $tags -}}
<style>
  .post-wrapper[data-special] { display: none; }
  .post-wrapper[data-special].special-show { display: block; }
  .special-filter-list { list-style: none; margin: 0; padding: 0; }
  .special-filter-item label {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 0; cursor: pointer; font-size: 0.95rem;
  }
  .special-filter-checkbox {
    accent-color: var(--color-link); width: 15px; height: 15px;
    cursor: pointer; margin: 0; flex-shrink: 0;
  }
  .special-filter-name { color: var(--color-link); }
  .special-filter-class {
    font-size: 0.78rem; opacity: 0.6;
    border: 1px solid currentColor; border-radius: 4px; padding: 0 5px;
  }
</style>
<div class="widget-wrapper" id="special-filter-widget" style="display: none;">
  <div class="widget-wrap" data-aos="{{ .Site.Params.animation.options.home.widget }}">
    <div style="display: flex; justify-content: space-between;">
      <h3 class="widget-title">{{ i18n "specialShow" | default "特殊展示" }}</h3>
    </div>
    <div class="widget">
      <ul class="special-filter-list">
        {{- range $tag := $tags -}}
        <li class="special-filter-item">
          <label>
            <input type="checkbox" class="special-filter-checkbox" value="{{ $tag.data }}" />
            <span class="special-filter-name">{{ $tag.name }}</span>
            {{- with $tag.class }}<span class="special-filter-class">{{ . }}</span>{{ end -}}
          </label>
        </li>
        {{- end -}}
      </ul>
    </div>
  </div>
</div>
<script>
  (function () {
    function applyFilter() {
      var checked = Array.prototype.slice
        .call(document.querySelectorAll('.special-filter-checkbox:checked'))
        .map(function (b) { return (b.value || '').trim().toLowerCase(); });
      document.querySelectorAll('.post-wrapper[data-special]').forEach(function (el) {
        var v = (el.getAttribute('data-special') || '').trim().toLowerCase();
        if (checked.indexOf(v) !== -1) {
          el.classList.add('special-show');
        } else {
          el.classList.remove('special-show');
        }
      });
    }
    function init() {
      var widget = document.getElementById('special-filter-widget');
      if (!widget) return;
      var specials = document.querySelectorAll('.post-wrapper[data-special]');
      if (!specials.length) return;
      widget.style.display = '';
      widget.querySelectorAll('.special-filter-checkbox').forEach(function (b) {
        b.addEventListener('change', applyFilter);
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
{{- end -}}
